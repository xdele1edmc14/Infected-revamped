# Infected Plugin Configuration

settings:
  # Admins can switch this from the Infected GUI while the event is in the lobby.
  default-round-mode: deathmatch
  modes:
    time-limit:
      starting-zombies: 2        # Initial zombies used only for Time Limit rounds
      time-limit-seconds: 600     # Active-play time; survivors win when this reaches zero
      # Time Limit zombies always have exactly one life.
      boss-bar:
        enabled: true
        title: "&eTime Remaining: &f{time}"
        color: YELLOW             # PINK, BLUE, RED, GREEN, YELLOW, PURPLE, or WHITE
        style: SOLID              # SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, or SEGMENTED_20
      tracking-compass:
        enabled: true
        give-below-minutes: 5     # Zombies receive compasses only below this remaining time
    deathmatch:
      starting-zombies: 5        # Initial zombies used only for Deathmatch rounds
      infected-lives: 3          # Deaths each zombie can take before becoming a spectator
      tracking-compass:
        enabled: true
        remove-below-zombies: 10 # Compasses return if the zombie count climbs back to this number

  infected-teleport-delay: 10    # Seconds after all the survivals finished teleporting, to start teleporting the infected players

  teleport-batch-size: 10        # Players teleported per teleport-delay to avoid lag
  teleport-delay: 5              # Delay in TICKS between each teleport batch (20 ticks = 1 second)

# Scoreboard configuration
scoreboard:
  enabled: true
  update-interval-ticks: 20
  title: "<gradient:#55ffff:#ff5555><bold>INFECTED</bold></gradient>"

  # Every visible line is configurable. MiniMessage and legacy & color codes
  # are both supported, but should not be mixed in the same string.
  layouts:
    survivor:
      - ""
      - "<gray>Role: <aqua>{role}"
      - "<gray>Kills: <white>{kills}"
      - "<gray>Mode: <white>{round_mode}"
      - "<gray>Time: <white>{time_remaining}"
      - ""
      - "<aqua>Survivors: <white>{survivors}"
      - "<red>Infected: <white>{infected}"
      - ""
      - "<gray>Outbreak"
      - "{outbreak_bar}"
    infected:
      - ""
      - "<gray>Role: <red>{role}"
      - "<gray>Infections: <white>{infections}"
      - "<gray>Lives: {lives_hearts} <white>{lives}/{max_lives}"
      - "<gray>Mode: <white>{round_mode}"
      - "<gray>Time: <white>{time_remaining}"
      - ""
      - "<aqua>Survivors: <white>{survivors}"
      - "<red>Infected: <white>{infected}"
      - ""
      - "<gray>Outbreak"
      - "{outbreak_bar}"
    spectator:
      - ""
      - "<gray>Role: <white>{role}"
      - "<gray>Mode: <white>{round_mode}"
      - "<gray>Time: <white>{time_remaining}"
      - ""
      - "<aqua>Survivors: <white>{survivors}"
      - "<red>Infected: <white>{infected}"
      - ""
      - "<gray>Outbreak"
      - "{outbreak_bar}"

  role-names:
    survivor: "Survivor"
    infected: "Infected"
    spectator: "Spectator"

  lives:
    full: "<red>♥"
    empty: "<dark_gray>♡"

  outbreak:
    segments: 12
    survivor-segment: "<aqua>■"
    infected-segment: "<red>■"
    empty-segment: "<dark_gray>■"

# Messages
messages:
  get-ready:
    title: "&e&lGET READY!"
    subtitle: ""
    fade-in: 10
    stay: 40
    fade-out: 10
  infected-release-countdown:
    title: "&e&l{time}"
    subtitle: ""
    fade-in: 0
    stay: 20
    fade-out: 0
    sound: "block.note_block.hat"
    volume: 1.0
    pitch: 1.0
  infection-started:
    title: "&c&lINFECTION HAS STARTED!"
    subtitle: ""
    fade-in: 10
    stay: 50
    fade-out: 10
    sound: "block.note_block.bell"
    volume: 1.0
    pitch: 0.5
  game-start: "&eThe Infected game has started with &c{zombies} &ezombies!"
  game-stop: "The Infected game has been stopped!"
  zombies-teleporting: "&cInfected zombies will be teleported in &e{time} &cseconds..."
  infected: "&c{player} has been infected!"
  all-infected:
    chat: "&4All survivors are infected! Zombies win!"
    title: "&4Zombies Win!"
    subtitle: "&7All survivors have been infected!"
  all-survivors:
    chat: "&2All infected have been eliminated! Survivors win!"
    title: "&2Survivors Win!"
    subtitle: "&7All infected have been eliminated!"
  time-limit-survived:
    chat: "&2The time limit expired with survivors remaining! Survivors win!"
    title: "&2Survivors Win!"
    subtitle: "&7The survivors outlasted the time limit!"
  config-reloaded: "&aInfected plugin configuration reloaded!"
  round-abandoned: "&eThe Infected round was abandoned because a team left the event."
  infected-respawn-unavailable: "&cNo infected respawn is available. The round has been cancelled."
  infected-admission-teleport-failed: "&cThe infected player could not be teleported safely. The round has been cancelled."
  tracking-compass:
    enabled: "&eZombie tracking compasses are now &aenabled&e."
    disabled: "&eZombie tracking compasses are now &cdisabled&e."

infected-spawn:

# Legacy shared points are copied once into each role below and retained for rollback.
teleports:

# Independent arena spawns used after the infected holding phase.
spawns:
  survivor:
  infected-release:
  infected-respawn:
